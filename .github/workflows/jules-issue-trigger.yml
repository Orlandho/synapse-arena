name: Jules Task Orchestrator

on:
  issues:
    types: [labeled]

jobs:
  jules-task-dispatch:
    if: github.event.label.name == 'jules'
    name: Dispatch Task to Jules Agent
    runs-on: ubuntu-latest

    steps:
      - name: Acknowledge Jules Task
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const issueTitle = context.payload.issue.title;
            const comment = `🤖 **Agente Jules Activado en Paralelo**\n\nSe ha recibido la tarea: \`${issueTitle}\`.\n\n* **Guía de Arquitectura:** Consultando [AGENTS.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/AGENTS.md).\n* **Entorno de Pruebas:** Los cambios deberán superar la suite de [jules-ci.yml](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/workflows/jules-ci.yml).\n\nIniciando análisis y generación de Pull Request en rama aislada...`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });
