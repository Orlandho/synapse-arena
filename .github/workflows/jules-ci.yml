name: Jules CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jules-verification:
    name: Jules Verification & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Static Code Analysis (Linting & Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: White-Box & Unit Tests (Python Unittest)
        run: |
          python -m unittest discover -s tests -v

      - name: Black-Box Integration & Functional Tests
        run: |
          # Verify standalone simulator HTML exists and is non-empty
          test -s index.html
          # Verify requirement file integrity
          test -s requirements.txt

      - name: Regression & Performance Boundary Verification
        run: |
          # Verify core simulation engines and migration protocols load cleanly
          python -c "from src.arena_distributed_mesh import SpatialPartitioningProtocol, MigrationPayload; from src.synapse_evolution_engine import Genome, mutate, crossover; assert SpatialPartitioningProtocol is not None"

